name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc -p .
      - name: Database security + flow tests (RLS, grants, timers, billing, GDPR)
        run: ./run-db-tests.sh | tee db-test.log && grep -q 'ALL TESTS PASSED' db-test.log
      - name: Server tests (Stripe webhook, reconcile, outbox, field encryption)
        run: npm run test:node
